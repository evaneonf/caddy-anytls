name: docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "testdata/wireguard.Caddyfile"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "testdata/wireguard.Caddyfile"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
  workflow_dispatch:
  schedule:
    # Run the heavier race detector once daily at 04:00 Asia/Shanghai.
    - cron: "0 20 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FULL_CHECKS: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Caddy Docker version
        run: |
          set -euo pipefail

          module_version="$(go list -m -f '{{ .Version }}' github.com/caddyserver/caddy/v2)"
          builder_version="$(sed -n 's/^FROM caddy:\([0-9][^- ]*\)-builder AS builder$/\1/p' Dockerfile)"
          runtime_version="$(sed -n 's/^FROM caddy:\([0-9][^ ]*\) AS runtime$/\1/p' Dockerfile)"

          if [ -z "$builder_version" ] || [ -z "$runtime_version" ]; then
            echo "Could not parse Caddy image versions from Dockerfile" >&2
            exit 1
          fi
          if [ "$builder_version" != "$runtime_version" ]; then
            echo "Caddy builder image ${builder_version} does not match runtime image ${runtime_version}" >&2
            exit 1
          fi
          if [ "$module_version" != "v${builder_version}" ]; then
            echo "Dockerfile Caddy image ${builder_version} does not match go.mod ${module_version}" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Race test
        if: env.FULL_CHECKS == 'true'
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Verify modules
        if: env.FULL_CHECKS == 'true'
        run: go mod verify

      - name: Staticcheck
        if: env.FULL_CHECKS == 'true'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: golangci-lint
        if: env.FULL_CHECKS == 'true'
        uses: golangci/golangci-lint-action@v9

  docker-smoke:
    name: Docker (wireguard smoke)
    needs: go
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build WireGuard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: wireguard
          platforms: linux/amd64
          load: true
          tags: caddy-anytls:wireguard-smoke
          cache-from: type=gha,scope=docker-smoke-wireguard-amd64
          cache-to: type=gha,mode=max,scope=docker-smoke-wireguard-amd64

      - name: Verify WireGuard module and Caddyfile adapter
        run: |
          set -euo pipefail

          docker run --rm caddy-anytls:wireguard-smoke caddy list-modules \
            | grep -Fx 'caddy.listeners.anytls.outbounds.wireguard'
          docker run --rm \
            -v "$GITHUB_WORKSPACE/testdata/wireguard.Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy-anytls:wireguard-smoke \
            caddy adapt --adapter caddyfile --config /etc/caddy/Caddyfile >/dev/null

  docker-prepare:
    runs-on: ubuntu-latest
    needs: go
    if: github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      push: ${{ steps.publish.outputs.push }}
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail

          publish=false
          reason="not a publishing event"

          if [ "$REF_TYPE" = "tag" ]; then
            publish=true
            reason="release tag"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            publish=true
            reason="manual dispatch"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            previous_sha="$(gh run list \
              --workflow "$WORKFLOW_NAME" \
              --event schedule \
              --status success \
              --limit 1 \
              --json headSha \
              --jq '.[0].headSha // ""')"

            if [ -z "$previous_sha" ]; then
              publish=true
              reason="no previous successful scheduled run"
            elif [ "$previous_sha" = "$GITHUB_SHA" ]; then
              reason="scheduled run already published this commit"
            elif git diff --quiet "$previous_sha" "$GITHUB_SHA" -- \
              Dockerfile \
              .dockerignore \
              .github/workflows/docker.yml \
              testdata/wireguard.Caddyfile \
              go.mod \
              go.sum \
              ':(glob)**/*.go'; then
              reason="no Docker or Go inputs changed since previous scheduled run"
            else
              publish=true
              reason="Docker or Go inputs changed since previous scheduled run"
            fi
          fi

          {
            echo "push=$publish"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          echo "$reason"

  docker-build:
    name: Docker (${{ matrix.flavor }}, ${{ matrix.platform }})
    needs: docker-prepare
    if: needs.docker-prepare.outputs.push == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            flavor: core
            tag_suffix: ""
            rolling_tag: latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            flavor: core
            tag_suffix: ""
            rolling_tag: latest
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            flavor: wireguard
            tag_suffix: -wireguard
            rolling_tag: wireguard
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            flavor: wireguard
            tag_suffix: -wireguard
            rolling_tag: wireguard
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag_suffix }}
            type=ref,event=tag,suffix=${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.rolling_tag }},enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.flavor }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.flavor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.flavor }}-${{ matrix.arch }}

      - name: Verify image modules
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          docker pull "$image"
          docker run --rm "$image" caddy list-modules \
            | grep -Fx 'caddy.listeners.anytls'
          if [ "$FLAVOR" = "wireguard" ]; then
            docker run --rm "$image" caddy list-modules \
              | grep -Fx 'caddy.listeners.anytls.outbounds.wireguard'
            docker run --rm \
              -v "$GITHUB_WORKSPACE/testdata/wireguard.Caddyfile:/etc/caddy/Caddyfile:ro" \
              "$image" \
              caddy adapt --adapter caddyfile --config /etc/caddy/Caddyfile >/dev/null
          fi

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.flavor }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Docker manifest (${{ matrix.flavor }})
    needs: docker-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: core
            tag_suffix: ""
            rolling_tag: latest
          - flavor: wireguard
            tag_suffix: -wireguard
            rolling_tag: wireguard
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.flavor }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.tag_suffix }}
            type=ref,event=tag,suffix=${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.rolling_tag }},enable=${{ github.ref_type == 'tag' }}

      - name: Create and push manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail

          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA")

          images=()
          for digest in /tmp/digests/*; do
            images+=("${IMAGE}@sha256:$(basename "$digest")")
          done

          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Inspect image
        env:
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          tag="$(jq -r '.tags[0]' <<< "$METADATA")"
          docker buildx imagetools inspect "$tag"

  release:
    name: GitHub Release
    needs: docker-merge
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          previous_tag="$(git describe \
            --tags \
            --abbrev=0 \
            "${GITHUB_SHA}^" 2>/dev/null || true)"

          {
            echo "## Container images"
            echo
            echo "### Core"
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${TAG}"
            echo '```'
            echo
            echo "### WireGuard"
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${TAG}-wireguard"
            echo '```'
            echo
            echo "Rolling tags:"
            echo
            echo "- \`${IMAGE}:latest\`"
            echo "- \`${IMAGE}:wireguard\`"
            echo
            echo "## Changes"
            echo

            if [ -n "$previous_tag" ]; then
              git log \
                --no-merges \
                --pretty='- %s (`%h`)' \
                "${previous_tag}..${GITHUB_SHA}"
            else
              git log \
                --no-merges \
                --pretty='- %s (`%h`)'
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: actions/github-script@v9
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require("fs");
            const tag = process.env.TAG;
            const body = fs.readFileSync("release-notes.md", "utf8");

            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag,
              });
              core.info(`Release ${tag} already exists`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              body,
              draft: false,
              prerelease: false,
              make_latest: "true",
            });
